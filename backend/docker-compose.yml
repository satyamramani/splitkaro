version: '3.8'

services:
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: splitkaro_pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Optional Caddy reverse proxy for automatic HTTPS with Let's Encrypt
  # To use with your domain on a cloud VPS:
  # 1. Update backend/Caddyfile with your domain (e.g. api.yourdomain.com)
  # 2. Uncomment the caddy service below
